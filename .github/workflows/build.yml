name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: EnchantLimit/pom.xml
      - name: Compile
        run: mvn -B -f EnchantLimit/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: EnchantLimit
          path: EnchantLimit/target/EnchantLimit.jar
